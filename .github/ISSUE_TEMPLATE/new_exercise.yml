name: New Exercise
description: Submit a new hands-on security exercise mapped to an OWASP Top 10 for LLM Applications category.
title: "New Exercise: [Title]"
labels: ["new-content", "exercise"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing an exercise! Exercises are hands-on challenges
        that help practitioners understand and defend against LLM vulnerabilities.
        They are model-agnostic — the learner brings their own model.
        Read [CONTRIBUTING.md](../CONTRIBUTING.md) before submitting.

  - type: dropdown
    id: owasp-category
    attributes:
      label: OWASP LLM Category
      description: Which OWASP Top 10 for LLM Applications category does this exercise address?
      options:
        - "LLM01 - Prompt Injection"
        - "LLM02 - Sensitive Information Disclosure"
        - "LLM03 - Supply Chain"
        - "LLM04 - Data and Model Poisoning"
        - "LLM05 - Improper Output Handling"
        - "LLM06 - Excessive Agency"
        - "LLM07 - System Prompt Leakage"
        - "LLM08 - Vector and Embedding Weaknesses"
        - "LLM09 - Misinformation"
        - "LLM10 - Unbounded Consumption"
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty Level
      description: Target difficulty for practitioners attempting this exercise.
      options:
        - Beginner
        - Intermediate
        - Advanced
    validations:
      required: true

  - type: dropdown
    id: challenge-type
    attributes:
      label: Challenge Type
      description: Select the format of this exercise.
      options:
        - Black-box
        - White-box
        - CTF
        - Guided
    validations:
      required: true

  - type: input
    id: time-estimate
    attributes:
      label: Estimated Completion Time
      description: How long should a practitioner expect to spend on this lab?
      placeholder: "e.g., 30 minutes, 1-2 hours"
    validations:
      required: true

  - type: input
    id: points
    attributes:
      label: Points / Score Value
      description: >
        If this exercise has a verifiable answer (e.g., CTF-style), how many points is it worth?
        Enter 0 or N/A if not applicable.
      placeholder: "e.g., 100, 250, N/A"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Exercise Description
      description: >
        Describe the scenario, learning objectives, and what practitioners
        will achieve upon completion.
      placeholder: |
        In this exercise, participants exploit an indirect prompt injection
        vulnerability in a customer support chatbot backed by a RAG pipeline
        they run themselves. By the end, participants understand how to craft
        adversarial documents and how defenders can detect such attacks.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      options:
        - label: I have read CONTRIBUTING.md and my content meets the guidelines.
          required: true
        - label: The exercise is purely educational and defensive in nature.
          required: true
        - label: No live credentials, API keys, or tokens are included in exercise materials.
          required: true
        - label: The exercise runs against a model the learner controls (their own API key or a local model), never a production system.
          required: true
        - label: Any external dependencies or APIs required are documented.
          required: true
