version: 2
updates:
  # npm dependencies (Next.js, MDX, Velite, and the dev toolchain)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # keep noise down: batch non-major updates into one PR per week
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions used in the CI / CodeQL / content-validation workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
